name: Update store data

# Pulls the app price, Pro in-app purchase price, and version from the
# App Store and writes them into index.html. Commits only when a value
# changed, which redeploys GitHub Pages.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: store-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pricing from the App Store
        run: python3 scripts/update-store-data.py

      - name: Commit if anything changed
        run: |
          if git diff --quiet; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/data/store.json
          git commit -m "Store data: $(python3 -c "import json; d=json.load(open('assets/data/store.json')); print(f\"app {d['app_price']}, Pro {d['pro_price']}, v{d['version']}\")")"
          git push
